params:
  reference_image:
    target: Reference Image.image
    type: input_path
    required: true
  driving_video:
    target: Driving Video.file
    type: input_path
    required: true
  continue_video:
    target: Continue Frames.file
    type: input_path
    optional_node:
    - Continue Frames Frames
    - Continue Frames
    description: Previous window's output tail (continuation windows only)
  prompt:
    target: Positive Prompt.text
    type: str
    required: true
    description: 'Character Description: ...\nBackground description: ... (describes the reference)'
  pose_prompt:
    target: Pose Prompt.text
    type: str
  negative:
    target: Negative Prompt.text
    type: str
  width:
    target: Animate.width
    type: int
    required: true
  height:
    target: Animate.height
    type: int
    required: true
  length:
    target: Animate.length
    type: int
    required: true
  video_frame_offset:
    target: Animate.video_frame_offset
    type: int
  reference_strength:
    target: Animate.reference_image_strength
    type: float
  pose_strength:
    target: Animate.pose_strength
    type: float
  shift:
    target: Model Sampling.shift
    type: float
  unet:
    target: Diffusion Model.unet_name
    type: str
  speed_lora:
    target: Speed LoRA.lora_name
    type: str
    optional_node: Speed LoRA
  pose_cache:
    target: Pose Cache.device
    type: str
    optional_node: Pose Cache
  seed:
    target:
    - Sampler.noise_seed
    type: seed
  steps:
    target: Scheduler.steps
    type: int
  cfg:
    target: Sampler.cfg
    type: float
  sampler:
    target: Sampler Select.sampler_name
    type: str
  scheduler:
    target: Scheduler.scheduler
    type: str
bypass:
  Speed LoRA:
    0: model
  Pose Cache:
    0: model
  Continue Frames: remove
  Continue Frames Frames: remove
outputs:
  frames:
    node: Save Frames
