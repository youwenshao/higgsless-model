[project]
name = "higgsless-model"
version = "0.1.0"
description = "Higgsfield without the Higgs: an agent-driven CLI that regenerates music videos with new characters and new vocals using open models on a local ComfyUI workstation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "youwenshao" }]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "httpx>=0.28",
    "websockets>=14",
    "asyncssh>=2.18",
    "numpy>=2.0",
    "pillow>=11",
    "opentimelineio>=0.17",
]

[project.optional-dependencies]
# Japanese lyric fitting needs kanji readings.
ja = ["fugashi>=1.4", "unidic-lite>=1.0.8"]
# Lets worker tasks run natively (without the tools container), e.g. on the workstation itself.
worker = [
    "scenedetect[opencv-headless]>=0.6.5",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
higgsless = "higgsless.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "scenedetect[opencv-headless]>=0.6.5",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/higgsless"]

[tool.hatch.build.targets.wheel.force-include]
"engines" = "higgsless/_data/engines"
"workflows" = "higgsless/_data/workflows"
"worker" = "higgsless/_data/worker"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "remote: needs the workstation (ComfyUI and a GPU)",
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
]
