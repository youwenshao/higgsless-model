id: rebuild.wan_animate2
title: Wan-Animate-2 motion transfer (new scene, same performance)
capability: rebuild
backend: comfyui
default: true
workflow: rebuild.wan_animate2/standard.api.json
bindings: rebuild.wan_animate2/bindings.yaml
licence:
  weights: Apache-2.0
  code: Apache-2.0
  commercial: true
constraints:
  dim_multiple: 16
  window: 81
  overlap: 1
  native_fps: 24
models:
- wan_animate2_int8@draft
- wan_animate2_int8@standard
- wan_animate2_bf16@max
- lightx2v_i2v_480p
- umt5_xxl_fp8
- wan21_vae_bf16
- clip_vision_h
defaults:
  steps: 6
  cfg: 1.0
  sampler: lcm
  scheduler: simple
  shift: 5.0
  speed_lora: lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
  pose_cache: gpu
  unet: wan_animate_2_int8_convrot.safetensors
  reference_strength: 1.0
profiles:
  draft: {}
  standard: {}
  max:
    unet: wan_animate_2_bf16.safetensors
    speed_lora:
    steps: 40
    cfg: 3.0
    sampler: euler
links:
- https://huggingface.co/Wan-AI/Wan2.2-Animate-2-14B
